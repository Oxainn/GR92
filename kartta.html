<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GR92 Kartta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#0f1f0f; font-family:-apple-system,sans-serif; overflow:hidden; }
#map { position:fixed; inset:0; }
.leaflet-control-zoom a { background:rgba(15,31,15,0.92)!important; color:#f5f0e8!important; border-color:rgba(255,255,255,0.15)!important; font-size:16px!important; }
.leaflet-control-attribution { display:none!important; }
.leaflet-control-zoom { margin-bottom:80px!important; margin-right:14px!important; }

.top-bar {
  position:fixed;top:0;left:0;right:0;z-index:1000;
  padding:10px 14px 8px;
  padding-top:max(10px,env(safe-area-inset-top,0px) + 8px);
  background:linear-gradient(180deg,rgba(8,16,8,0.97) 65%,transparent);
  display:flex;align-items:center;gap:11px;
}
.back-btn {
  background:rgba(255,255,255,0.11);border:1px solid rgba(255,255,255,0.18);
  color:#f5f0e8;width:36px;height:36px;border-radius:50%;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  text-decoration:none;flex-shrink:0;
}
.map-title{font-size:15px;font-weight:700;color:#f5f0e8;line-height:1.2;flex:1;}
.map-sub{font-size:11px;color:#7aab6e;margin-top:1px;}

.side-btns{
  position:fixed;right:13px;z-index:1000;
  top:max(68px,env(safe-area-inset-top,0px) + 60px);
  display:flex;flex-direction:column;gap:8px;
}
.icon-btn{
  background:rgba(8,16,8,0.92);border:1px solid rgba(255,255,255,0.18);
  border-radius:50%;width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;color:#f5f0e8;transition:all 0.2s;
}
.icon-btn.active{background:rgba(59,130,246,0.35);border-color:#3b82f6;}
.text-btn{
  background:rgba(8,16,8,0.92);border:1px solid rgba(255,255,255,0.18);
  border-radius:9px;padding:6px 9px;
  color:#f5f0e8;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:0.07em;text-align:center;
}
.dl-btn{
  background:rgba(8,16,8,0.92);border:1px solid rgba(255,255,255,0.18);
  border-radius:9px;padding:6px 9px;
  color:#f5f0e8;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;
}

.info-panel{
  position:fixed;top:max(68px,env(safe-area-inset-top,0px) + 60px);
  left:12px;right:65px;z-index:1000;
  background:rgba(8,16,8,0.94);border:1px solid rgba(255,255,255,0.15);
  border-radius:13px;padding:11px 13px;display:none;
}
.info-close{float:right;background:rgba(255,255,255,0.1);border:none;color:#f5f0e8;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;}
.info-title{font-size:14px;font-weight:700;color:#f5f0e8;margin-bottom:6px;}
.info-stats{display:flex;gap:6px;flex-wrap:wrap;}
.stat-tag{padding:3px 8px;border-radius:7px;background:rgba(255,255,255,0.08);font-size:11px;color:#b8d4b0;}

.legend{
  position:fixed;bottom:0;left:0;right:0;z-index:1000;
  padding:9px 13px;
  padding-bottom:max(9px,env(safe-area-inset-bottom,0px) + 5px);
  background:linear-gradient(0deg,rgba(8,16,8,0.97) 65%,transparent);
}
.legend-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.legend-scroll::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:16px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.11);cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.chip.on{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.38);}
.chip-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.chip-txt{font-size:11px;color:#ede8e0;font-weight:500;}

#loadingOverlay{
  position:fixed;inset:0;z-index:2000;background:rgba(8,16,8,0.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loadingOverlay p{color:#7aab6e;font-size:14px;}
.spinner{width:40px;height:40px;border:3px solid rgba(74,124,63,0.3);border-top-color:#4a7c3f;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p>Ladataan karttaa...</p>
</div>

<div id="map"></div>

<div class="top-bar">
  <a class="back-btn" href="/">←</a>
  <div style="flex:1">
    <div class="map-title">🗺️ GR92 Reitti</div>
    <div class="map-sub" id="statusBar">Etapit 12–21 · Lloret → Garraf</div>
  </div>
  <button class="dl-btn" id="dlBtn" onclick="startDownload()">⬇️ Offline</button>
</div>

<div class="side-btns">
  <button class="icon-btn" id="gpsBtn" onclick="toggleGps()">📍</button>
  <button class="text-btn" id="btnLayer" onclick="cycleLayer()">SAT</button>
</div>

<div class="info-panel" id="infoPanel">
  <button class="info-close" onclick="closeInfo()">✕</button>
  <div class="info-title" id="infoTitle"></div>
  <div class="info-stats" id="infoStats"></div>
</div>

<div class="legend">
  <div class="legend-scroll" id="legendScroll"></div>
</div>

<script>
const COLORS = {"12": "#22c55e", "13": "#84cc16", "14": "#eab308", "15": "#f97316", "16": "#ef4444", "17": "#ec4899", "18": "#a855f7", "19": "#6366f1", "20": "#dc2626", "21": "#3b82f6"};
const NAMES  = {"12": "Lloret \u2192 Tordera", "13": "Tordera \u2192 Hortsaviny\u00e0", "14": "Hortsaviny\u00e0 \u2192 Vallgorguina", "15": "Vallgorguina \u2192 Can Bordoi", "16": "Can Bordoi \u2192 Font de Cera", "17": "Selva Negra \u2192 Montcada", "18": "Montcada \u2192 Vallvidrera", "19": "Vallvidrera \u2192 Can Ros", "20": "Sant Vicen\u00e7 \u2192 Bruguers", "21": "Bruguers \u2192 Garraf"};
const DATES  = {"12": "6.9.", "13": "7.9.", "14": "8.9.", "15": "10.9.", "16": "11.9.", "17": "12.9.", "18": "14.9.", "19": "15.9.", "20": "17.9.", "21": "18.9."};
const KMS    = {"12": 18, "13": 15, "14": 15, "15": 14, "16": 17, "17": 16, "18": 16, "19": 15, "20": 14, "21": 15};
const UPS    = {"12": 262, "13": 632, "14": 217, "15": 490, "16": 471, "17": 354, "18": 625, "19": 268, "20": 630, "21": 416};
const BOUNDS = [[1.9024509564042091, 41.253916919231415], [2.8453946113586426, 41.707470417022705]];

const layerDefs = {
  topo:      { url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', max:17 },
  satellite: { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', max:19 },
  street:    { url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', max:19 }
};
const layerOrder = ['topo','satellite','street'];
const layerNext  = {topo:'SAT', satellite:'KATU', street:'TOPO'};
let layerIdx = 0;
const routeLayers = {};
let activeStage = null;
let gpsMarker = null, gpsWatch = null, gpsOn = false;
let mapReady = false;

// Init map
const map = L.map('map', { zoomControl:true, attributionControl:false });
const tileLayer = L.tileLayer(layerDefs.topo.url, { maxZoom:layerDefs.topo.max, subdomains:'abc' }).addTo(map);

// Load GPX data from separate file
fetch('/gpx_data.json')
  .then(r => r.json())
  .then(GPX => {
    // Fit bounds
    map.fitBounds([[BOUNDS[0][1],BOUNDS[0][0]],[BOUNDS[1][1],BOUNDS[1][0]]], { padding:[50,50] });

    // Draw routes
    for (const [num, coords] of Object.entries(GPX)) {
      const latlngs = coords.map(c => [c[1], c[0]]);
      // Shadow
      L.polyline(latlngs, { color:'#000', weight:6, opacity:0.2, smoothFactor:1.5 }).addTo(map);
      // Route
      const line = L.polyline(latlngs, { color:COLORS[num], weight:4, opacity:0.95, smoothFactor:1.5 }).addTo(map);
      routeLayers[num] = line;
      line.on('click', () => { showInfo(num); setActive(num); });
      // Start dot
      const dot = L.circleMarker([latlngs[0][0],latlngs[0][1]], {
        radius:7, color:'#fff', weight:2, fillColor:COLORS[num], fillOpacity:1
      }).addTo(map);
      dot.on('click', () => { showInfo(num); flyTo(num); setActive(num); });
    }

    // Majoitus - Apartamentos Les Barbes
    const hotelIcon = L.divIcon({
      html: '<div style="font-size:24px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.7))">🏠</div>',
      className: '', iconSize:[28,28], iconAnchor:[14,28]
    });
    L.marker([41.568029, 2.526274], { icon: hotelIcon })
      .bindTooltip('🏠 Apartamentos Les Barbes<br><small>Caldes d\'Estrac — koko matkan majoitus</small>', {direction:'top', permanent:false})
      .on('click', () => window.open('https://maps.app.goo.gl/eALwNrYJYjNqEirr8', '_blank'))
      .addTo(map);

    // End flag
    const end = GPX['21'][GPX['21'].length-1];
    const flagIcon = L.divIcon({
      html:'<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.7))">🏁</div>',
      className:'', iconSize:[24,24], iconAnchor:[12,24]
    });
    L.marker([end[1],end[0]], { icon:flagIcon }).addTo(map);

    buildLegend();
    document.getElementById('loadingOverlay').style.display = 'none';
    mapReady = true;
  })
  .catch(err => {
    document.getElementById('loadingOverlay').innerHTML = '<p style="color:#ef4444">Kartan lataus epäonnistui.<br>Tarkista nettiyhteys.</p>';
    console.error('GPX load error:', err);
  });

// Legend
function buildLegend() {
  const el = document.getElementById('legendScroll');
  const all = document.createElement('div');
  all.className='chip on'; all.id='chip-all';
  all.innerHTML='<span style="font-size:13px">🗺️</span><span class="chip-txt">Kaikki</span>';
  all.onclick = showAll;
  el.appendChild(all);
  for (const [num, color] of Object.entries(COLORS)) {
    const chip = document.createElement('div');
    chip.className='chip'; chip.id='chip-'+num;
    chip.innerHTML='<div class="chip-dot" style="background:'+color+'"></div><span class="chip-txt">E'+num+' '+DATES[num]+'</span>';
    chip.onclick = () => { showInfo(num); flyTo(num); setActive(num); };
    el.appendChild(chip);
  }
}

function setActive(num) {
  activeStage = num;
  for (const [n, line] of Object.entries(routeLayers)) {
    line.setStyle(n === String(num) ? { opacity:1, weight:5 } : { opacity:0.15, weight:2.5 });
    const chip = document.getElementById('chip-'+n);
    if (chip) chip.classList.toggle('on', n === String(num));
  }
  document.getElementById('chip-all').classList.remove('on');
}

function showAll() {
  activeStage = null;
  for (const [n, line] of Object.entries(routeLayers)) {
    line.setStyle({ opacity:0.95, weight:4 });
    const chip = document.getElementById('chip-'+n);
    if (chip) chip.classList.remove('on');
  }
  document.getElementById('chip-all').classList.add('on');
  closeInfo();
  map.fitBounds([[BOUNDS[0][1],BOUNDS[0][0]],[BOUNDS[1][1],BOUNDS[1][0]]], { padding:[50,50] });
}

function flyTo(num) {
  const line = routeLayers[String(num)];
  if (line) map.fitBounds(line.getBounds(), { padding:[60,60] });
}

function showInfo(num) {
  document.getElementById('infoTitle').innerHTML =
    '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+COLORS[num]+';margin-right:6px;vertical-align:middle;"></span>'+
    'Etappi '+num+' · '+NAMES[num];
  document.getElementById('infoStats').innerHTML =
    '<div class="stat-tag">📅 '+DATES[num]+'</div>'+
    '<div class="stat-tag">📏 '+KMS[num]+' km</div>'+
    '<div class="stat-tag">⬆️ '+UPS[num]+' m</div>';
  document.getElementById('infoPanel').style.display='block';
}
function closeInfo() { document.getElementById('infoPanel').style.display='none'; }

function cycleLayer() {
  layerIdx = (layerIdx+1) % layerOrder.length;
  const def = layerDefs[layerOrder[layerIdx]];
  tileLayer.setUrl(def.url);
  tileLayer.options.maxZoom = def.max;
  for (const line of Object.values(routeLayers)) line.bringToFront();
  document.getElementById('btnLayer').textContent = layerNext[layerOrder[layerIdx]];
}

function toggleGps() {
  const btn = document.getElementById('gpsBtn');
  if (!gpsOn) {
    if (!navigator.geolocation) { alert('GPS ei ole käytettävissä.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (!gpsMarker) {
        const icon = L.divIcon({
          html:'<div style="width:18px;height:18px;background:#3b82f6;border:3px solid white;border-radius:50%;box-shadow:0 0 0 5px rgba(59,130,246,0.3)"></div>',
          className:'', iconSize:[18,18], iconAnchor:[9,9]
        });
        gpsMarker = L.marker(ll, { icon }).addTo(map);
      } else gpsMarker.setLatLng(ll);
      map.setView(ll, 14);
    }, () => alert('Sijainnin haku epäonnistui.'), { enableHighAccuracy:true });
    gpsWatch = navigator.geolocation.watchPosition(pos => {
      if (gpsMarker) gpsMarker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
    }, null, { enableHighAccuracy:true });
    gpsOn=true; btn.classList.add('active'); btn.textContent='🔵';
  } else {
    if (gpsWatch) navigator.geolocation.clearWatch(gpsWatch);
    if (gpsMarker) { map.removeLayer(gpsMarker); gpsMarker=null; }
    gpsOn=false; btn.classList.remove('active'); btn.textContent='📍';
  }
}

function updateStatus() {
  const bar = document.getElementById('statusBar');
  if (!navigator.onLine) { bar.textContent='📴 Offline — kartta toimii'; bar.style.color='#f97316'; }
  else { bar.textContent='Etapit 12–21 · Lloret → Garraf'; bar.style.color=''; }
}
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();

function startDownload() {
  if (!navigator.onLine) { alert('Tarvitset nettiyhteyden lataamiseen.'); return; }
  const btn = document.getElementById('dlBtn');
  btn.textContent='⏳';
  document.getElementById('statusBar').textContent='Ladataan karttaruutuja...';
  navigator.serviceWorker.ready.then(reg => {
    reg.active.postMessage('PRECACHE_TILES');
  }).catch(() => { btn.textContent='⬇️ Offline'; alert('Yritä uudelleen.'); });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'TILE_PROGRESS') {
      const pct = Math.round(e.data.cached / e.data.total * 100);
      document.getElementById('statusBar').textContent = 'Ladataan... '+pct+'%';
      document.getElementById('dlBtn').textContent = pct+'%';
    }
    if (e.data && e.data.type === 'TILE_DONE') {
      document.getElementById('statusBar').textContent = '✅ Offline valmis ('+e.data.cached+' ruutua)';
      document.getElementById('dlBtn').textContent = '✅';
    }
  });
}
</script>
</body>
</html>
