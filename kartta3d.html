<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1f0f">
<title>GR92 3D-maasto</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#0f1f0f; font-family:-apple-system,sans-serif; overflow:hidden; }
#map { position:fixed; inset:0; }
.maplibregl-ctrl-attrib { font-size:9px!important; }

.top-bar {
  position:fixed;top:0;left:0;right:0;z-index:1000;
  padding:10px 14px 8px;
  padding-top:max(10px,env(safe-area-inset-top,0px) + 8px);
  background:linear-gradient(180deg,rgba(8,16,8,0.97) 65%,transparent);
  display:flex;align-items:center;gap:11px;
}
.back-btn {
  background:rgba(255,255,255,0.11);border:1px solid rgba(255,255,255,0.18);
  color:#f5f0e8;width:36px;height:36px;border-radius:50%;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  text-decoration:none;flex-shrink:0;
}
.map-title{font-size:15px;font-weight:700;color:#f5f0e8;line-height:1.2;flex:1;}
.map-sub{font-size:11px;color:#7aab6e;margin-top:1px;}

.side-btns{
  position:fixed;right:13px;z-index:1000;
  top:max(68px,env(safe-area-inset-top,0px) + 60px);
  display:flex;flex-direction:column;gap:8px;
}
.text-btn{
  background:rgba(8,16,8,0.92);border:1px solid rgba(255,255,255,0.18);
  border-radius:9px;padding:7px 9px;min-width:46px;
  color:#f5f0e8;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:0.05em;text-align:center;
}

.info{
  position:fixed;top:max(68px,env(safe-area-inset-top,0px) + 60px);
  left:12px;right:70px;z-index:1000;
  background:rgba(8,16,8,0.94);border:1px solid rgba(255,255,255,0.15);
  border-radius:13px;padding:11px 13px;display:none;
}

.legend{
  position:fixed;bottom:0;left:0;right:0;z-index:1000;
  padding:9px 13px;
  padding-bottom:max(9px,env(safe-area-inset-bottom,0px) + 5px);
  background:linear-gradient(0deg,rgba(8,16,8,0.97) 65%,transparent);
}
.legend-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.legend-scroll::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:16px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.11);cursor:pointer;white-space:nowrap;}
.chip-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.chip-txt{font-size:11px;color:#ede8e0;font-weight:500;}

.hint{
  position:fixed;left:50%;transform:translateX(-50%);z-index:1000;
  bottom:max(58px,env(safe-area-inset-bottom,0px) + 54px);
  background:rgba(8,16,8,0.9);border:1px solid rgba(255,255,255,0.15);
  border-radius:20px;padding:7px 14px;color:#b8d4b0;font-size:11px;
  transition:opacity 0.6s;pointer-events:none;
}

#loading{
  position:fixed;inset:0;z-index:2000;background:rgba(8,16,8,0.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loading p{color:#7aab6e;font-size:14px;text-align:center;}
.spinner{width:40px;height:40px;border:3px solid rgba(74,124,63,0.3);border-top-color:#4a7c3f;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Ladataan 3D-maastoa...<br><small style="color:#5a7a52">Tarvitsee nettiyhteyden</small></p>
</div>

<div id="map"></div>

<div class="top-bar">
  <a class="back-btn" href="./index.html">←</a>
  <div style="flex:1">
    <div class="map-title">🏔️ GR92 3D-maasto</div>
    <div class="map-sub">Etapit 12–21 · suunnittele päivän kävely</div>
  </div>
</div>

<div class="side-btns">
  <button class="text-btn" id="btnLayer" onclick="toggleLayer()">SAT</button>
  <button class="text-btn" id="btnExag" onclick="toggleExag()">⛰️×1.6</button>
  <button class="text-btn" onclick="togglePitch()">2D/3D</button>
  <button class="text-btn" onclick="resetView()">KOKO</button>
</div>

<div class="info" id="info"></div>

<div class="legend">
  <div class="legend-scroll" id="legendScroll"></div>
</div>

<div class="hint" id="hint">Kahdella sormella kallista ja pyöritä maastoa</div>

<script>
const COLORS = {"12":"#22c55e","13":"#84cc16","14":"#eab308","15":"#f97316","16":"#ef4444","17":"#ec4899","18":"#a855f7","19":"#6366f1","20":"#dc2626","21":"#3b82f6"};
const NAMES  = {"12":"Lloret \u2192 Tordera","13":"Tordera \u2192 Hortsaviny\u00e0","14":"Hortsaviny\u00e0 \u2192 Vallgorguina","15":"Vallgorguina \u2192 Can Bordoi","16":"Can Bordoi \u2192 Font de Cera","17":"Selva Negra \u2192 Montcada","18":"Montcada \u2192 Vallvidrera","19":"Vallvidrera \u2192 Can Ros","20":"Sant Vicen\u00e7 \u2192 Bruguers","21":"Bruguers \u2192 Garraf"};
const DATES  = {"12":"6.9.","13":"7.9.","14":"8.9.","15":"10.9.","16":"11.9.","17":"12.9.","18":"14.9.","19":"15.9.","20":"17.9.","21":"18.9."};
const KMS    = {"12":18,"13":15,"14":15,"15":14,"16":17,"17":16,"18":16,"19":15,"20":14,"21":15};
const UPS    = {"12":262,"13":632,"14":217,"15":490,"16":471,"17":354,"18":625,"19":268,"20":630,"21":416};
const BOUNDS = [[1.9024509564042091, 41.253916919231415], [2.8453946113586426, 41.707470417022705]];

const style = {
  version: 8,
  glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
  sources: {
    topo:      { type:'raster', tiles:['https://a.tile.opentopomap.org/{z}/{x}/{y}.png','https://b.tile.opentopomap.org/{z}/{x}/{y}.png'], tileSize:256, maxzoom:17, attribution:'\u00a9 OpenTopoMap (CC-BY-SA)' },
    satellite: { type:'raster', tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256, maxzoom:19, attribution:'\u00a9 Esri World Imagery' },
    dem:       { type:'raster-dem', tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], tileSize:256, encoding:'terrarium', maxzoom:15, attribution:'Terrain: AWS / Mapzen' }
  },
  layers: [
    { id:'bg', type:'background', paint:{ 'background-color':'#0f1f0f' } },
    { id:'base-topo', type:'raster', source:'topo' },
    { id:'base-sat',  type:'raster', source:'satellite', layout:{ visibility:'none' } },
    { id:'hillshade', type:'hillshade', source:'dem', paint:{ 'hillshade-exaggeration':0.45 } }
  ],
  terrain: { source:'dem', exaggeration:1.6 }
};

const map = new maplibregl.Map({
  container:'map', style, center:[2.4,41.5], zoom:9,
  pitch:62, bearing:-18, maxPitch:80, attributionControl:false
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }), 'bottom-right');
map.addControl(new maplibregl.AttributionControl({ compact:true }));
map.touchZoomRotate.enableRotation();

let satOn = false, exag = 1.6;

function toggleLayer() {
  satOn = !satOn;
  map.setLayoutProperty('base-sat','visibility', satOn ? 'visible' : 'none');
  map.setLayoutProperty('base-topo','visibility', satOn ? 'none' : 'visible');
  document.getElementById('btnLayer').textContent = satOn ? 'TOPO' : 'SAT';
}
function toggleExag() {
  exag = (exag < 2) ? 2.5 : 1.6;
  map.setTerrain({ source:'dem', exaggeration:exag });
  document.getElementById('btnExag').textContent = '\u26f0\ufe0f\u00d7' + exag;
}
function togglePitch() {
  map.easeTo({ pitch: map.getPitch() > 10 ? 0 : 62, duration:600 });
}
function resetView() {
  map.fitBounds(BOUNDS, { padding:60, pitch:62, bearing:-18, duration:800 });
}

function addMarker(lngLat, emoji, label) {
  const el = document.createElement('div');
  el.style.cssText = 'font-size:24px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.7));cursor:pointer;';
  el.textContent = emoji;
  new maplibregl.Marker({ element:el, anchor:'bottom' })
    .setLngLat(lngLat)
    .setPopup(new maplibregl.Popup({ offset:18, closeButton:false }).setHTML('<b style="color:#0f1f0f">' + label + '</b>'))
    .addTo(map);
}

function buildLegend(GPX) {
  const el = document.getElementById('legendScroll');
  for (const [num, color] of Object.entries(COLORS)) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = '<div class="chip-dot" style="background:' + color + '"></div><span class="chip-txt">E' + num + ' ' + DATES[num] + '</span>';
    chip.onclick = () => flyToStage(GPX, num);
    el.appendChild(chip);
  }
}

function flyToStage(GPX, num) {
  const coords = GPX[num];
  let minLng=180, minLat=90, maxLng=-180, maxLat=-90;
  for (const c of coords) {
    minLng=Math.min(minLng,c[0]); maxLng=Math.max(maxLng,c[0]);
    minLat=Math.min(minLat,c[1]); maxLat=Math.max(maxLat,c[1]);
  }
  map.fitBounds([[minLng,minLat],[maxLng,maxLat]], { padding:80, pitch:64, duration:1000 });
  const info = document.getElementById('info');
  info.style.display = 'block';
  info.innerHTML =
    '<button onclick="document.getElementById(\'info\').style.display=\'none\'" style="float:right;background:rgba(255,255,255,0.1);border:none;color:#f5f0e8;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;">\u2715</button>' +
    '<div style="font-weight:700;color:#f5f0e8;margin-bottom:5px;"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + COLORS[num] + ';margin-right:6px;vertical-align:middle;"></span>Etappi ' + num + ' \u00b7 ' + NAMES[num] + '</div>' +
    '<div style="font-size:12px;color:#b8d4b0;">\ud83d\udcc5 ' + DATES[num] + ' \u00b7 \ud83d\udccf ' + KMS[num] + ' km \u00b7 \u2b06\ufe0f ' + UPS[num] + ' m nousua</div>';
}

map.on('load', () => {
  // Pehmeä taivas/usva (jos versio tukee — muuten ohitetaan)
  try {
    map.setSky({
      'sky-color':'#5a93ad', 'horizon-color':'#cfe0c6', 'fog-color':'#e6efe1',
      'sky-horizon-blend':0.6, 'horizon-fog-blend':0.5, 'fog-ground-blend':0.4
    });
  } catch (e) { /* sky ei tuettu tässä versiossa, ei haittaa */ }

  fetch('./gpx_data.json')
    .then(r => r.json())
    .then(GPX => {
      const features = Object.entries(GPX).map(([num, coords]) => ({
        type:'Feature', properties:{ num, color:COLORS[num] }, geometry:{ type:'LineString', coordinates:coords }
      }));
      map.addSource('routes', { type:'geojson', data:{ type:'FeatureCollection', features } });
      map.addLayer({ id:'routes-casing', type:'line', source:'routes',
        layout:{ 'line-join':'round','line-cap':'round' },
        paint:{ 'line-color':'#000','line-width':6,'line-opacity':0.35 } });
      map.addLayer({ id:'routes-line', type:'line', source:'routes',
        layout:{ 'line-join':'round','line-cap':'round' },
        paint:{ 'line-color':['get','color'],'line-width':4,'line-opacity':0.97 } });

      // Majoitus + maali
      addMarker([2.574169, 41.585276], '\ud83c\udfe0', 'Camping Victoria');
      const last = GPX['21'][GPX['21'].length - 1];
      addMarker(last, '\ud83c\udfc1', 'Garraf \u2014 maali');

      buildLegend(GPX);
      map.fitBounds(BOUNDS, { padding:60, pitch:62, bearing:-18, duration:0 });
      document.getElementById('loading').style.display = 'none';

      // Piilota vihje muutaman sekunnin jälkeen
      setTimeout(() => { const h=document.getElementById('hint'); if(h){ h.style.opacity='0'; setTimeout(()=>h.remove(),700);} }, 4500);
    })
    .catch(err => {
      console.error('GPX load error:', err);
      document.getElementById('loading').innerHTML =
        '<p style="color:#ef4444">Latauksen virhe.<br>3D-maasto tarvitsee nettiyhteyden.<br><br>' +
        '<a href="./kartta.html" style="color:#7aab6e">\u2190 Avaa tavallinen 2D-kartta (toimii offline)</a></p>';
    });
});

map.on('error', e => { if (e && e.error) console.warn('Map error:', e.error.message || e.error); });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
}
</script>
</body>
</html>
