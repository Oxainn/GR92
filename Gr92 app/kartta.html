  allChip.onclick = showAll;
  el.appendChild(allChip);
  for (const [num, color] of Object.entries(COLORS)) {
    const chip = document.createElement('div');
    chip.className='chip'; chip.id='chip-'+num;
    chip.innerHTML='<div class="chip-dot" style="background:'+color+'"></div><span class="chip-txt">E'+num+' '+DATES[num]+'</span>';
    chip.onclick = () => { showInfo(num); flyTo(num); setActive(num); };
    el.appendChild(chip);
  }
}

// ── Active stage ──────────────────────────────────────────────────────────
function setActive(num) {
  activeStage = num;
  // Dim non-active routes using filter
  map.setFilter('routes-line',   ['==', ['get','stage'], num]);
  map.setFilter('routes-shadow', ['==', ['get','stage'], num]);
  for (const n of Object.keys(COLORS)) {
    const chip = document.getElementById('chip-'+n);
    if (chip) chip.classList.toggle('on', n === String(num));
  }
  document.getElementById('chip-all').classList.remove('on');
  // Show other routes dimmed
  if (!map.getLayer('routes-dim')) {
    map.addLayer({
      id:'routes-dim', type:'line', source:'routes',
      layout:{ 'line-join':'round', 'line-cap':'round' },
      paint:{ 'line-color': COLOR_EXPR, 'line-width':2.5, 'line-opacity':0.15 }
    }, 'routes-shadow');
  }
  map.setFilter('routes-dim', ['!=', ['get','stage'], num]);
}

function showAll() {
  activeStage = null;
  map.setFilter('routes-line',   null);
  map.setFilter('routes-shadow', null);
  if (map.getLayer('routes-dim')) map.removeLayer('routes-dim');
  for (const n of Object.keys(COLORS)) {
    const chip = document.getElementById('chip-'+n);
    if (chip) chip.classList.remove('on');
  }
  document.getElementById('chip-all').classList.add('on');
  closeInfo();
  map.fitBounds(BOUNDS, { padding:50, pitch:50, bearing:-10, duration:900 });
}

function flyTo(num) {
  const coords = GPX[String(num)];
  const lons = coords.map(c=>c[0]), lats = coords.map(c=>c[1]);
  map.fitBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],
    { padding:60, pitch: is3D ? 58 : 0, bearing:-10, duration:900 });
}

function showInfo(num) {
  document.getElementById('infoTitle').innerHTML =
    '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+COLORS[num]+';margin-right:6px;vertical-align:middle;"></span>'+
    'Etappi '+num+' · '+NAMES[num];
  document.getElementById('infoStats').innerHTML =
    '<div class="stat-tag">📅 '+DATES[num]+'</div>'+
    '<div class="stat-tag">📏 '+KMS[num]+' km</div>'+
    '<div class="stat-tag">⬆️ '+UPS[num]+' m</div>';
  document.getElementById('infoPanel').style.display='block';
}
function closeInfo() { document.getElementById('infoPanel').style.display='none'; }

// ── 3D ────────────────────────────────────────────────────────────────────
function toggle3D() {
  is3D = !is3D;
  const btn = document.getElementById('btn3d');
  try {
    map.setTerrain({ source:'dem', exaggeration: is3D ? 2.0 : 0 });
  } catch(e) {}
  map.easeTo({ pitch: is3D ? 50 : 0, bearing: is3D ? -10 : 0, duration:600 });
  btn.classList.toggle('active', is3D);
}

// ── Layer cycle ───────────────────────────────────────────────────────────
function cycleLayer() {
  layerIdx = (layerIdx+1) % LAYER_CYCLE.length;
  const name = LAYER_CYCLE[layerIdx];
  const src = map.getSource('basemap');
  if (src && src.setTiles) {
    src.setTiles([TILE_URLS[name]]);
  }
  document.getElementById('btnLayer').textContent = LAYER_NEXT[name];
}

// ── GPS ───────────────────────────────────────────────────────────────────
function toggleGps() {
  const btn = document.getElementById('gpsBtn');
  if (!gpsOn) {
    if (!navigator.geolocation) { alert('GPS ei ole käytettävissä.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const ll = [pos.coords.longitude, pos.coords.latitude];
      if (!gpsMarker) {
        const el = document.createElement('div');
        el.style.cssText='width:18px;height:18px;background:#3b82f6;border:3px solid white;border-radius:50%;box-shadow:0 0 0 5px rgba(59,130,246,0.3)';
        gpsMarker = new maplibregl.Marker({element:el}).setLngLat(ll).addTo(map);
      } else gpsMarker.setLngLat(ll);
      map.easeTo({ center:ll, zoom:13, duration:700 });
    }, () => alert('Sijainnin haku epäonnistui.'), { enableHighAccuracy:true });
    gpsWatch = navigator.geolocation.watchPosition(pos => {
      if (gpsMarker) gpsMarker.setLngLat([pos.coords.longitude, pos.coords.latitude]);
    }, null, { enableHighAccuracy:true });
    gpsOn=true; btn.classList.add('active'); btn.textContent='🔵';
  } else {
    if (gpsWatch) navigator.geolocation.clearWatch(gpsWatch);
    if (gpsMarker) { gpsMarker.remove(); gpsMarker=null; }
    gpsOn=false; btn.classList.remove('active'); btn.textContent='📍';
  }
}
</script>
</body>
